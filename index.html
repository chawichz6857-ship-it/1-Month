<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Happy Anniversary 💕</title>
    
    <style>
        /* ==================== Reset & Base Styles ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, 
                #ffd1dc 0%, 
                #ffb3c6 25%, 
                #ffc9d9 50%, 
                #ffb3c6 75%, 
                #ffd1dc 100%
            );
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ==================== Animations ==================== */
        @keyframes fadeIn {
            from { 
                opacity: 0; 
                transform: scale(0.95);
            }
            to { 
                opacity: 1; 
                transform: scale(1);
            }
        }

        @keyframes smoothHeartbeat {
            0%, 100% { 
                transform: scale(1);
            }
            10% { 
                transform: scale(1.05);
            }
            20% { 
                transform: scale(1);
            }
            30% { 
                transform: scale(1.08);
            }
            40% { 
                transform: scale(1);
            }
        }

        @keyframes bgFloat {
            0%, 100% { 
                transform: translateY(0) rotate(0deg); 
            }
            50% { 
                transform: translateY(-30px) rotate(10deg); 
            }
        }

        @keyframes sparkle {
            0%, 100% { 
                opacity: 0;
                transform: scale(0);
            }
            50% { 
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ==================== Layout ==================== */
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* ==================== Heart Section ==================== */
        .heart-container {
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 70px;
            position: relative;
            overflow: visible;
        }

        .big-heart {
            width: 100%;
            height: 100%;
            transform: scale(1.8);
            transform-origin: center;
            animation: heartbeat 3s ease-in-out infinite;
        }

        .big-heart svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 10px 20px rgba(255, 30, 86, 0.3));
        }

        /* Heart Gradient Colors */
        .heart-gradient-1 {
            stop-color: #ff6b9d;
        }

        .heart-gradient-2 {
            stop-color: #ff1e56;
        }

        .heart-gradient-3 {
            stop-color: #ff1744;
        }

        /* ==================== Text Overlay ==================== */
        .anniversary-text {
            position: absolute;
            top: 54%;              /* ← ขยับลงนิดเดียว */
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: clamp(0.9rem, 3.5vw, 1.1rem);
            font-weight: 700;
            text-shadow: 0 3px 15px rgba(0, 0, 0, 0.4);
            z-index: 2;
            text-align: center;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .anniversary-text small {
            display: block;
            font-size: clamp(0.9rem, 3.5vw, 1.1rem);
            margin-top: 5px;
            font-weight: 800;
        }

        /* ==================== Button ==================== */
        .start-btn {
            background: white;
            color: #ff1744;
            border: none;
            padding: 16px 50px;
            border-radius: 50px;
            font-size: clamp(1.1rem, 4vw, 1.25rem);
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 23, 68, 0.3);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            letter-spacing: 1px;
            text-decoration: none;
            display: inline-block;
            touch-action: manipulation;
            margin-top: 0;
            position: relative;
            z-index: 99999;
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 23, 68, 0.4);
        }

        .start-btn:active {
            transform: translateY(-1px) scale(0.98);
            box-shadow: 0 8px 20px rgba(255, 23, 68, 0.3);
        }

        /* ==================== Background Elements ==================== */
        .bg-heart {
            position: fixed;
            font-size: 80px;
            opacity: 0.08;
            pointer-events: none;
            animation: bgFloat 20s ease-in-out infinite;
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            opacity: 0;
            animation: sparkle 2s ease-in-out infinite;
        }

        /* ==================== Responsive Design ==================== */
        @media (max-width: 380px) {
            .heart-container {
                width: 240px;
                height: 240px;
                margin-bottom: 30px;
            }

            .start-btn {
                padding: 14px 40px;
            }
        }

        @media (max-width: 320px) {
            .heart-container {
                width: 200px;
                height: 200px;
            }
        }
    </style>
</head>

<body>
    <!-- Background Hearts -->
    <div class="bg-heart" style="top: 10%; left: 10%;">💕</div>
    <div class="bg-heart" style="top: 20%; right: 15%; animation-delay: 3s;">💖</div>
    <div class="bg-heart" style="bottom: 15%; left: 15%; animation-delay: 6s;">💗</div>
    <div class="bg-heart" style="bottom: 25%; right: 10%; animation-delay: 9s;">💘</div>

    <!-- Main Container -->
    <div class="container">
        <!-- Heart Container -->
        <div class="heart-container">
            <div class="big-heart">
                <!-- SVG Heart -->
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" class="heart-gradient-1" />
                            <stop offset="50%" class="heart-gradient-2" />
                            <stop offset="100%" class="heart-gradient-3" />
                        </linearGradient>
                    </defs>
                    <path d="M50,85 C50,85 15,60 15,40 C15,30 20,20 30,20 C40,20 45,25 50,35 C55,25 60,20 70,20 C80,20 85,30 85,40 C85,60 50,85 50,85 Z" 
                          fill="url(#heartGradient)" 
                          stroke="rgba(255,255,255,0.3)" 
                          stroke-width="0.5"/>
                </svg>

                <!-- Anniversary Text -->
                <div class="anniversary-text">
                    Happy Anniversary
                    <small>Na Ouan</small>
                </div>
            </div>

            <!-- Sparkles -->
            <div class="sparkle" style="top: 10%; left: 20%; animation-delay: 0s;"></div>
            <div class="sparkle" style="top: 15%; right: 25%; animation-delay: 0.5s;"></div>
            <div class="sparkle" style="bottom: 20%; left: 15%; animation-delay: 1s;"></div>
            <div class="sparkle" style="bottom: 25%; right: 20%; animation-delay: 1.5s;"></div>
            <div class="sparkle" style="top: 50%; left: 5%; animation-delay: 0.3s;"></div>
            <div class="sparkle" style="top: 50%; right: 5%; animation-delay: 0.8s;"></div>
        </div>

        <!-- Start Button -->
        <div>
            <a href="lock.html" class="start-btn">Start</a>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        // ==================== Prevent Double Tap Zoom ====================
        let lastTouchEnd = 0;
        

        // ==================== Create Floating Hearts ====================
        function createHearts() {
            const hearts = ['💕', '💖', '💗', '💘', '💙', '💜'];
            
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.style.position = 'fixed';
                    heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
                    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.bottom = '-50px';
                    heart.style.animation = 'floatUp 4s ease-in-out';
                    heart.style.pointerEvents = 'none';
                    heart.style.zIndex = '9999';
                    document.body.appendChild(heart);
                    
                    setTimeout(() => heart.remove(), 4000);
                }, i * 200);
            }
        }

        // ==================== Float Up Animation ====================
        const style = document.createElement('style');
        style.textContent = `
            @keyframes floatUp {
                0% {
                    transform: translateY(0) rotate(0deg);
                    opacity: 1;
                }
                100% {
                    transform: translateY(-120vh) rotate(720deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // ==================== Initialize ====================
        window.onload = () => createHearts();
    </script>
</body>
</html>
