<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งแต่วันแรกที่คบกัน</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Anuphan', sans-serif;
            min-height: 100dvh;
            background: linear-gradient(135deg, #ffeef8 0%, #ffe5f3 25%, #fff0f9 50%, #f8e8ff 75%, #ffe8f5 100%);
            background-size: 400% 400%;
            background-attachment: scroll;
            animation: gradientFlow 15s ease infinite;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            padding: 1rem;
            -webkit-overflow-scrolling: touch;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .sparkle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            opacity: 0;
            animation: sparkleFloat 3s infinite;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
            pointer-events: none;
        }

        @keyframes sparkleFloat {
            0% { 
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { 
                transform: translateY(-100px) scale(1);
                opacity: 0;
            }
        }

        .container {
            text-align: center;
            z-index: 10;
            animation: containerFadeIn 1s ease-out;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 0;
        }

        @keyframes containerFadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .anniversary-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 35px;
            padding: 3rem 2.5rem;
            box-shadow: 
                0 30px 60px rgba(255, 110, 196, 0.25),
                inset 0 -2px 15px rgba(255, 110, 196, 0.1);
            animation: cardEntrance 1.2s ease-out;
            border: 2px solid rgba(255, 255, 255, 0.8);
        }

        @keyframes cardEntrance {
            0% {
                opacity: 0;
                transform: scale(0.7) rotateY(-180deg);
            }
            60% {
                transform: scale(1.03) rotateY(10deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotateY(0deg);
            }
        }

        .title {
            font-family: 'Mitr', sans-serif;
            font-size: 1.6rem;
            font-weight: 500;
            color: #666;
            margin-bottom: 1.5rem;
            animation: titleFade 1s ease-out 0.3s both;
        }

        @keyframes titleFade {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .days-number {
            font-family: 'Mitr', sans-serif;
            font-size: 5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6ec4 0%, #ff8fd4 50%, #ffb3e0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0.5rem 0;
            animation: numberPulse 2s ease-in-out infinite, numberEntrance 1s ease-out 0.5s both;
        }

        @keyframes numberEntrance {
            0% {
                opacity: 0;
                transform: scale(0.5) rotate(-10deg);
            }
            60% {
                transform: scale(1.1) rotate(5deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        @keyframes numberPulse {
            0%, 100% {
                transform: scale(1);
                filter: brightness(1);
            }
            50% {
                transform: scale(1.05);
                filter: brightness(1.2);
            }
        }

        .days-label {
            font-family: 'Anuphan', sans-serif;
            font-size: 1.3rem;
            color: #888;
            margin-bottom: 2rem;
            animation: titleFade 1s ease-out 0.6s both;
        }

        .photo-container {
            width: 100%;
            max-width: 320px;
            margin: 0 auto 2rem;
            animation: photoEntrance 1s ease-out 0.8s both;
        }

        @keyframes photoEntrance {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(50px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .photo-frame {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 
                0 15px 40px rgba(255, 110, 196, 0.3),
                0 5px 15px rgba(0, 0, 0, 0.1);
            transform: rotate(-2deg);
            transition: transform 0.3s ease;
        }

        .photo-frame:hover {
            transform: rotate(0deg) scale(1.05);
        }

        .photo-frame img {
            width: 100%;
            height: auto;
            display: block;
            aspect-ratio: 4/3;
            object-fit: cover;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.8rem;
            margin-top: 2rem;
            animation: statsEntrance 1s ease-out 1s both;
        }

        @keyframes statsEntrance {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stat-box {
            background: linear-gradient(135deg, #ff6ec4 0%, #ff8fd4 100%);
            border-radius: 18px;
            padding: 1.2rem 0.8rem;
            box-shadow: 
                0 8px 20px rgba(255, 110, 196, 0.3),
                inset 0 2px 8px rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            animation: statBoxPop 0.6s ease-out backwards;
        }

        .stat-box:nth-child(1) { animation-delay: 1.1s; }
        .stat-box:nth-child(2) { animation-delay: 1.2s; }
        .stat-box:nth-child(3) { animation-delay: 1.3s; }
        .stat-box:nth-child(4) { animation-delay: 1.4s; }

        @keyframes statBoxPop {
            0% {
                opacity: 0;
                transform: scale(0) rotate(-90deg);
            }
            70% {
                transform: scale(1.1) rotate(5deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .stat-box:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 
                0 12px 30px rgba(255, 110, 196, 0.5),
                inset 0 2px 8px rgba(255, 255, 255, 0.4);
        }

        .stat-number {
            font-family: 'Mitr', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: white;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.2);
            display: block;
        }

        .stat-label {
            font-family: 'Anuphan', sans-serif;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.95);
            font-weight: 500;
            margin-top: 0.3rem;
            display: block;
        }

        .bottom-text {
            font-family: 'Mitr', sans-serif;
            font-size: 1.5rem;
            font-weight: 500;
            margin-top: 2rem;
            background: linear-gradient(135deg, #ff6ec4 0%, #ffd700 50%, #ff8fd4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textFloat 3s ease-in-out infinite, textEntrance 1s ease-out 1.7s both;
        }

        .continue-button {
            margin-top: 2rem;
            padding: 1rem 3rem;
            background: linear-gradient(135deg, #ff6ec4 0%, #ff8fd4 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-family: 'Mitr', sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 110, 196, 0.4);
            transition: all 0.3s ease;
            animation: buttonEntrance 1s ease-out 1.9s both;
            text-decoration: none;
            display: inline-block;
        }

        .continue-button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 12px 30px rgba(255, 110, 196, 0.6);
        }

        @keyframes buttonEntrance {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes textEntrance {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes textFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .heart {
            position: fixed;
            font-size: 20px;
            opacity: 0;
            animation: heartFloat 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes heartFloat {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0);
                opacity: 0;
            }
            10% { opacity: 0.8; }
            50% { opacity: 0.6; }
            90% { opacity: 0.3; }
            100% {
                transform: translateY(-100px) rotate(360deg) scale(1.5);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            body {
                background-attachment: scroll;
            }

            .anniversary-card {
                padding: 2.5rem 1.8rem;
            }

            .title {
                font-size: 1.3rem;
            }

            .days-number {
                font-size: 4rem;
            }

            .days-label {
                font-size: 1.1rem;
            }

            .stats-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.7rem;
            }

            .stat-number {
                font-size: 1.8rem;
            }

            .stat-label {
                font-size: 0.85rem;
            }

            .bottom-text {
                font-size: 1.3rem;
            }

            .continue-button {
                font-size: 1rem;
                padding: 0.8rem 2rem;
            }

            .sparkle,
            .heart {
                position: absolute;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="anniversary-card">
            <h1 class="title">ตั้งแต่วันแรกที่คบกัน</h1>
            
            <div class="days-number" id="totalDays">0</div>
            <div class="days-label">วัน</div>

            <div class="photo-container">
                <div class="photo-frame">
                    <img src="images/our-photo.jpg" alt="Our Photo" onerror="this.src='https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=400&h=300&fit=crop'">
                </div>
            </div>

            <div class="stats-container">
                <div class="stat-box">
                    <span class="stat-number" id="days">0</span>
                    <span class="stat-label">วัน</span>
                </div>
                <div class="stat-box">
                    <span class="stat-number" id="hours">0</span>
                    <span class="stat-label">ชั่วโมง</span>
                </div>
                <div class="stat-box">
                    <span class="stat-number" id="minutes">0</span>
                    <span class="stat-label">นาที</span>
                </div>
                <div class="stat-box">
                    <span class="stat-number" id="seconds">0</span>
                    <span class="stat-label">วินาที</span>
                </div>
            </div>
        </div>

        <p class="bottom-text">คบกันมา <span id="bottomDays">0</span> ชั้นแล้ว</p>
        
        <a href="moments.html" class="continue-button">
            ดูความทรงจำของเรา 💕
        </a>
    </div>

    <script>
        // สร้างดาวระยิบระยับ
        for(let i = 0; i < 30; i++) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.left = Math.random() * 100 + '%';
            sparkle.style.animationDelay = Math.random() * 3 + 's';
            sparkle.style.animationDuration = (Math.random() * 2 + 2) + 's';
            document.body.appendChild(sparkle);
        }

        // สร้างหัวใจลอย
        for(let i = 0; i < 20; i++) {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = Math.random() > 0.5 ? '💕' : '❤️';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDelay = Math.random() * 4 + 's';
            heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
            document.body.appendChild(heart);
        }

        // ตั้งวันที่เริ่มคบกัน: 9 ธันวาคม 2568 เวลา 05:17 น.
        const startDate = new Date(2025, 11, 9, 5, 17, 0); // เดือนใน JavaScript เริ่มจาก 0 (ธันวาคม = 11)
        
        function updateCountdown() {
            const now = new Date();
            const diff = now - startDate;
            
            const totalDays = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById('totalDays').textContent = totalDays;
            document.getElementById('days').textContent = totalDays;
            document.getElementById('hours').textContent = hours;
            document.getElementById('minutes').textContent = minutes;
            document.getElementById('seconds').textContent = seconds;
            document.getElementById('bottomDays').textContent = totalDays;
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
