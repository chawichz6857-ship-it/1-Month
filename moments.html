<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Sweet Moments 💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Anuphan', sans-serif;
            background: linear-gradient(135deg, #ffd1dc 0%, #ffb3c6 25%, #ffc9d9 50%, #ffb3c6 75%, #ffd1dc 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Background floating hearts */
        .bg-heart {
            position: fixed;
            font-size: 60px;
            opacity: 0.06;
            pointer-events: none;
            animation: bgFloat 20s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes bgFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(10deg); }
        }

        .moments-page {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .page-header {
            text-align: center;
            margin-bottom: 35px;
            animation: fadeInDown 0.8s ease-out;
        }

        @keyframes fadeInDown {
            from { 
                opacity: 0; 
                transform: translateY(-30px);
            }
            to { 
                opacity: 1; 
                transform: translateY(0);
            }
        }

        .page-title {
            color: #ff1744;
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 8px;
            text-shadow: 0 3px 15px rgba(255, 23, 68, 0.3);
            font-family: 'Mitr', sans-serif;
        }

        .page-subtitle {
            color: #666;
            font-size: 16px;
            font-weight: 500;
        }

        .moments-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .moment-card {
            background: white;
            padding: 30px 20px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            overflow: hidden;
            border: 3px solid transparent;
            animation: cardPop 0.6s ease-out backwards;
        }

        .moment-card:nth-child(1) { animation-delay: 0.1s; }
        .moment-card:nth-child(2) { animation-delay: 0.2s; }
        .moment-card:nth-child(3) { animation-delay: 0.3s; }
        .moment-card:nth-child(4) { animation-delay: 0.4s; }

        @keyframes cardPop {
            from { 
                opacity: 0; 
                transform: scale(0.5) translateY(50px);
            }
            to { 
                opacity: 1; 
                transform: scale(1) translateY(0);
            }
        }

        .moment-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #ff6b9d 0%, #ff1744 100%);
            border-radius: 25px 25px 0 0;
        }

        .moment-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.05) 0%, rgba(255, 23, 68, 0.05) 100%);
            opacity: 0;
            transition: opacity 0.3s;
            border-radius: 25px;
        }

        .moment-card:hover {
            transform: translateY(-12px) scale(1.05);
            box-shadow: 0 20px 50px rgba(255, 23, 68, 0.3);
            border-color: #ff6b9d;
        }

        .moment-card:hover::after {
            opacity: 1;
        }

        .moment-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: bounce 2s infinite;
            position: relative;
            z-index: 1;
            background: linear-gradient(135deg, #ff6b9d 0%, #ff1744 100%);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(255, 23, 68, 0.3);
        }

        .moment-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Fallback emoji style if no image */
        .moment-icon:not(:has(img)) {
            font-size: 56px;
            color: white;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .moment-card:hover .moment-icon {
            animation: none;
            transform: scale(1.15) rotate(5deg);
        }

        .moment-title {
            color: #ff1744;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            font-family: 'Mitr', sans-serif;
            position: relative;
            z-index: 1;
        }

        .moment-desc {
            color: #888;
            font-size: 14px;
            font-weight: 500;
            position: relative;
            z-index: 1;
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
            animation: fadeInUp 0.8s ease-out 0.5s backwards;
        }

        @keyframes fadeInUp {
            from { 
                opacity: 0; 
                transform: translateY(30px);
            }
            to { 
                opacity: 1; 
                transform: translateY(0);
            }
        }

        .nav-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 20px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            font-family: 'Mitr', sans-serif;
        }

        .nav-btn.secondary {
            background: white;
            color: #ff1744;
            border: 3px solid #ff1744;
        }

        .nav-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 35px rgba(255, 23, 68, 0.35);
        }

        .nav-btn:active {
            transform: translateY(-2px);
        }

        /* Floating hearts animation */
        .heart-float {
            position: fixed;
            font-size: 24px;
            animation: heartFloat 4s ease-in-out;
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
        }

        @keyframes heartFloat {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-120vh) rotate(720deg);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .page-title {
                font-size: 28px;
            }

            .moments-grid {
                gap: 15px;
            }

            .moment-card {
                padding: 25px 15px;
            }

            .moment-icon {
                width: 80px;
                height: 80px;
                margin-bottom: 10px;
            }

            /* Fallback emoji font size for mobile */
            .moment-icon:not(:has(img)) {
                font-size: 44px;
            }

            .moment-title {
                font-size: 18px;
            }

            .moment-desc {
                font-size: 13px;
            }

            .nav-btn {
                font-size: 15px;
                padding: 14px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 1.5rem 0.8rem;
            }

            .moments-page {
                padding: 10px;
            }

            .page-title {
                font-size: 24px;
            }

            .page-subtitle {
                font-size: 14px;
            }

            .moment-card {
                padding: 20px 12px;
            }

            .moment-icon {
                width: 70px;
                height: 70px;
                margin-bottom: 8px;
            }

            /* Fallback emoji font size for small mobile */
            .moment-icon:not(:has(img)) {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <!-- Background hearts -->
    <div class="bg-heart" style="top: 8%; left: 8%;">💕</div>
    <div class="bg-heart" style="top: 15%; right: 12%; animation-delay: 3s;">💖</div>
    <div class="bg-heart" style="bottom: 12%; left: 12%; animation-delay: 6s;">💗</div>
    <div class="bg-heart" style="bottom: 20%; right: 8%; animation-delay: 9s;">💘</div>
    <div class="bg-heart" style="top: 50%; left: 5%; animation-delay: 12s;">💝</div>
    <div class="bg-heart" style="top: 60%; right: 5%; animation-delay: 15s;">💓</div>

    <div class="moments-page">
        <div class="page-header">
            <div class="page-title">Our Sweet Moments</div>
            <div class="page-subtitle">ความทรงจำดีๆของเรา 💕</div>
        </div>
        
        <div class="moments-grid">
            <div class="moment-card" onclick="goToPage('memory-game.html')">
                <div class="moment-icon">
                    <img src="images/icon-memory.jpg" alt="Memory Game" onerror="this.parentElement.innerHTML='🎴'">
                </div>
                <div class="moment-title">Memory For You</div>
                <div class="moment-desc">วันเวลาของเรา</div>
            </div>

            <div class="moment-card" onclick="goToPage('gallery.html')">
                <div class="moment-icon">
                    <img src="images/icon-calendar.jpg" alt="Calendar" onerror="this.parentElement.innerHTML='📅'">
                </div>
                <div class="moment-title">Our Love Month</div>
                <div class="moment-desc">1 เดือนแห่งความทรงจำ</div>
            </div>

            <div class="moment-card" onclick="goToPage('mini-game.html')">
                <div class="moment-icon">
                    <img src="images/icon-game.jpg" alt="Game" onerror="this.parentElement.innerHTML='🎮'">
                </div>
                <div class="moment-title">Mini Game</div>
                <div class="moment-desc">เกมสนุกๆ</div>
            </div>

            <div class="moment-card" onclick="goToPage('letters.html')">
                <div class="moment-icon">
                    <img src="images/icon-letter.jpg" alt="Letter" onerror="this.parentElement.innerHTML='💌'">
                </div>
                <div class="moment-title">Love Letters</div>
                <div class="moment-desc">จดหมายรัก</div>
            </div>
        </div>
        
        <div class="nav-buttons">
            <button class="nav-btn secondary" onclick="goToPage('index.html')">🏠 กลับหน้าแรก</button>
        </div>
    </div>

    <script>
        // Navigation function
        function goToPage(page) {
            createHearts(15);
            setTimeout(() => {
                window.location.href = page;
            }, 300);
        }

        // Create floating hearts effect
        function createHearts(count = 15) {
            const hearts = ['💕', '💖', '💗', '💘', '💝', '💓'];
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart-float';
                    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                    heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 5000);
                }, i * 80);
            }
        }

        // Add sparkle effect on card hover
        document.querySelectorAll('.moment-card').forEach(card => {
            card.addEventListener('mouseenter', () => {
                createSparkles(card);
            });
        });

        function createSparkles(element) {
            const rect = element.getBoundingClientRect();
            const sparkles = ['✨', '⭐', '💫'];
            
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const sparkle = document.createElement('div');
                    sparkle.textContent = sparkles[Math.floor(Math.random() * sparkles.length)];
                    sparkle.style.position = 'fixed';
                    sparkle.style.left = (rect.left + Math.random() * rect.width) + 'px';
                    sparkle.style.top = (rect.top + Math.random() * rect.height) + 'px';
                    sparkle.style.fontSize = '20px';
                    sparkle.style.pointerEvents = 'none';
                    sparkle.style.zIndex = '9999';
                    sparkle.style.animation = 'sparkleFloat 1.5s ease-out forwards';
                    document.body.appendChild(sparkle);
                    setTimeout(() => sparkle.remove(), 1500);
                }, i * 100);
            }
        }

        // Add sparkle animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes sparkleFloat {
                0% {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
                100% {
                    opacity: 0;
                    transform: translateY(-50px) scale(0);
                }
            }
        `;
        document.head.appendChild(style);

        // Initial hearts animation on load
        window.addEventListener('load', () => {
            createHearts(8);
        });
    </script>
</body>
</html>
