<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Year 💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Anuphan', sans-serif;
            background: linear-gradient(135deg, #ffd1dc 0%, #ffb3c6 25%, #ffc9d9 50%, #ffb3c6 75%, #ffd1dc 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
                        position: relative;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .title {
            color: #ff1744;
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(255, 23, 68, 0.2);
        }

        .subtitle {
            color: #666;
            font-size: 18px;
            font-weight: 500;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 2rem;
        }

        .day-card {
            background: white;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: all 0.3s ease;
            animation: cardAppear 0.5s ease-out backwards;
        }

        .day-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(255, 23, 68, 0.3);
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .day-icon {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            margin-bottom: 10px;
            overflow: hidden;
            position: relative;
        }

        .day-icon video,
        .day-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .day-icon .emoji {
            position: relative;
            z-index: 1;
        }

        .day-label {
            text-align: center;
            color: #ff1744;
            font-weight: 700;
            font-size: 16px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            animation: modalFadeIn 0.3s ease-out;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            position: relative;
            margin: 2% auto;
            width: 90%;
            max-width: 500px;
            animation: modalSlideIn 0.4s ease-out;
        }

        @keyframes modalSlideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            background: white;
            padding: 20px;
            border-radius: 20px 20px 0 0;
            text-align: center;
        }

        .modal-title {
            color: #ff1744;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .modal-subtitle {
            color: #666;
            font-size: 14px;
        }

        .modal-video-container {
            background: white;
            padding: 15px;
            border-radius: 0 0 20px 20px;
        }

        .video-wrapper {
            width: 100%;
            aspect-ratio: 9/16;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-wrapper video,
        .video-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-placeholder {
            text-align: center;
            color: white;
            padding: 20px;
        }

        .video-placeholder .emoji {
            font-size: 80px;
            margin-bottom: 10px;
        }

        .video-placeholder p {
            font-size: 16px;
        }

        .close-btn {
            position: absolute;
            top: -50px;
            right: 0;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 23, 68, 0.8);
            border-radius: 50%;
        }

        .close-btn:hover {
            background: #ff1744;
            transform: rotate(90deg);
        }

        @media (max-width: 768px) {
            .title {
                font-size: 32px;
            }

            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 15px;
            }

            .day-icon {
                font-size: 40px;
            }

            .modal-content {
                width: 95%;
            }
        }
    </style>
</head>

        // สร้างการ์ดสำหรับแต่ละวัน
        function createGallery() {
            const grid = document.getElementById('galleryGrid');
            
            daysData.forEach((day, index) => {
                const card = document.createElement('div');
                card.className = 'day-card';
                card.style.animationDelay = `${index * 0.05}s`;
                card.onclick = () => openModal(day);
                
                let iconContent = '';
                
                // ถ้ามี thumbnail (วิดีโอหรือรูป) ให้แสดงเป็นปก
                if (day.thumbnail) {
                    if (day.thumbnail.endsWith('.mp4') || day.thumbnail.endsWith('.webm')) {
                        // ถ้าเป็นไฟล์วิดีโอ
                        iconContent = `
                            <video muted loop autoplay playsinline>
                                <source src="${day.thumbnail}" type="video/mp4">
                            </video>
                            <div class="emoji">${day.emoji}</div>
                        `;
                    } else {
                        // ถ้าเป็นรูปภาพ
                        iconContent = `
                            <img src="${day.thumbnail}" alt="Day ${day.day}">
                            <div class="emoji">${day.emoji}</div>
                        `;
                    }
                } else {
                    // ถ้าไม่มี thumbnail ให้แสดง emoji อย่างเดียว
                    iconContent = day.emoji;
                }
                
                card.innerHTML = `
                    <div class="day-icon">${iconContent}</div>
                    <div class="day-label">Day ${day.day}</div>
                `;
                
                grid.appendChild(card);
            });
        }

        // เปิด Modal
        function openModal(dayData) {
            const modal = document.getElementById('videoModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalSubtitle = document.getElementById('modalSubtitle');
            const wrapper = document.getElementById('videoWrapper');
            
            modalTitle.textContent = `Day ${dayData.day}`;
            modalSubtitle.textContent = dayData.nameTH;
            
            if (dayData.video) {
                // ถ้ามีวิดีโอ
                wrapper.innerHTML = `
    <video id="modalVideo" controls playsinline>
    <source src="${dayData.video}" type="video/mp4">
</video>
`;
setTimeout(() => {
    const video = document.getElementById('modalVideo');
    if (video) {
        video.muted = false;
        video.play();
    }
}, 100);
            } else if (dayData.img) {
                // ถ้ามีรูปภาพ
                wrapper.innerHTML = `<img src="${dayData.img}" alt="Day ${dayData.day}">`;
            } else {
                // ถ้าไม่มีทั้งสองอย่าง แสดง placeholder
                wrapper.innerHTML = `
                    <div class="video-placeholder">
                        <div class="emoji">${dayData.emoji}</div>
                        <p>ใส่วิดีโอหรือรูปภาพของ ${dayData.nameTH}</p>
                    </div>
                `;
            }
            history.pushState({ modal: true }, '');
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        // ปิด Modal
function closeModal() {
    const modal = document.getElementById('videoModal');
    const wrapper = document.getElementById('videoWrapper');

    const video = wrapper.querySelector('video');
    if (video) {
        video.pause();
        video.currentTime = 0;
    }

    wrapper.innerHTML = '';
    modal.style.display = 'none';
    document.body.style.overflow = 'auto';
}


        // ปิด Modal เมื่อคลิกนอก content
        window.onclick = function(event) {
            const modal = document.getElementById('videoModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        // ปิด Modal ด้วย ESC key
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeModal();
            }
        });

        // สร้าง Gallery เมื่อโหลดหน้าเว็บ

        window.addEventListener('popstate', function () {
    const modal = document.getElementById('videoModal');
    if (modal && modal.style.display === 'block') {
        closeModal();
    }
});

createGallery();
