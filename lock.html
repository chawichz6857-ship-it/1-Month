<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ล็อครหัส 💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Anuphan', sans-serif;
            background: linear-gradient(135deg, #ffd1dc 0%, #ffb3c6 25%, #ffc9d9 50%, #ffb3c6 75%, #ffd1dc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            overflow-x: hidden;
        }

        .lock-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1rem;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .polaroid {
            background: white;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transform: rotate(-8deg);
            margin-bottom: 40px;
            position: relative;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            animation: polaroidFloat 3s ease-in-out infinite;
        }

        @keyframes polaroidFloat {
            0%, 100% { transform: rotate(-8deg) translateY(0); }
            50% { transform: rotate(-8deg) translateY(-10px); }
        }

        .polaroid:hover {
            transform: rotate(-3deg) scale(1.08) translateY(-5px);
            box-shadow: 0 25px 70px rgba(255, 23, 68, 0.4);
        }

        .polaroid-img {
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            border-radius: 3px;
        }

        .polaroid-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .polaroid-text {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Brush Script MT', cursive;    
            font-size: 26px;
            color: #ffffff;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
            font-weight: 600;
            text-align: center;
        }

        .lock-container {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            padding: 40px 35px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            text-align: center;
            width: 100%;
            max-width: 360px;
            border: 2px solid rgba(255, 255, 255, 0.8);
        }

        .lock-title {
            color: #ff1744;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-shadow: 0 2px 10px rgba(255, 23, 68, 0.2);
        }

        .lock-title span:first-child {
            animation: rotateIcon 3s ease-in-out infinite;
        }

        @keyframes rotateIcon {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-15deg); }
            75% { transform: rotate(15deg); }
        }

        .lock-subtitle {
            color: #888;
            font-size: 16px;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .pin-display {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 35px;
        }

        .pin-dot {
            width: 60px;
            height: 60px;
            border: 3px solid #ffc9d9;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 800;
            background: white;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .pin-dot.filled {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff1744 100%);
            color: white;
            border-color: #ff1744;
            transform: scale(1.15) rotate(360deg);
            box-shadow: 0 8px 25px rgba(255, 23, 68, 0.4);
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
            padding: 5px;
        }

        .key {
            width: 75px;
            height: 75px;
            background: linear-gradient(145deg, #ffffff, #f5f5f5);
            border: none;
            border-radius: 50%;
            font-size: 28px;
            font-weight: 800;
            color: #ff1744;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 8px 20px rgba(0,0,0,0.15),
                inset 0 -2px 5px rgba(0,0,0,0.1);
        }

        .key:hover {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff1744 100%);
            color: white;
            transform: translateY(-5px) scale(1.1);
        }

        .key:active {
            transform: translateY(0) scale(0.95);
        }

        .key.zero {
            grid-column: 2;
        }

        .key.delete {
            grid-column: span 3;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(145deg, #ffebee, #ffcdd2);
            color: #d32f2f;
        }

        .key.delete:hover {
            background: linear-gradient(135deg, #ffb3c6 0%, #ff8fa3 100%);
            color: white;
        }

        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .heart-float {
            position: fixed;
            font-size: 24px;
            animation: heartFloat 4s ease-in-out;
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
        }

        @keyframes heartFloat {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-120vh) rotate(720deg);
                opacity: 0;
            }
        }

        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            animation: particleFall 2s ease-out forwards;
        }

        @keyframes particleFall {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg) scale(0);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .lock-page {
                padding: 1rem;
            }

            .polaroid-img {
                width: 180px;
                height: 180px;
            }

            .lock-container {
                padding: 30px 25px;
            }

            .pin-dot {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }

            .key {
                width: 65px;
                height: 65px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="lock-page">
        <div class="polaroid">
            <div class="polaroid-img">
                <img src="images/our-photo.jpg" alt="Couple Photo" onerror="this.src='https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=400&h=400&fit=crop'">
            </div>
            <div class="polaroid-text">love you <3 </div>
        </div>
        
        <div class="lock-container">
            <div class="lock-title">
                <span>🎀</span>
                <span>My Lock</span>
            </div>
            <div class="lock-subtitle">รหัสอารายน้าา?</div>
            <div class="pin-display">
                <div class="pin-dot" id="pin1"></div>
                <div class="pin-dot" id="pin2"></div>
                <div class="pin-dot" id="pin3"></div>
                <div class="pin-dot" id="pin4"></div>
            </div>
            <div class="keypad">
                <div class="key" onclick="addPin('1')">1</div>
                <div class="key" onclick="addPin('2')">2</div>
                <div class="key" onclick="addPin('3')">3</div>
                <div class="key" onclick="addPin('4')">4</div>
                <div class="key" onclick="addPin('5')">5</div>
                <div class="key" onclick="addPin('6')">6</div>
                <div class="key" onclick="addPin('7')">7</div>
                <div class="key" onclick="addPin('8')">8</div>
                <div class="key" onclick="addPin('9')">9</div>
                <div class="key zero" onclick="addPin('0')">0</div>
                <div class="key delete" onclick="clearPin()">🔙 ลบทั้งหมด</div>
            </div>
        </div>
    </div>

    <script>
        let pinCode = '';
        const correctPin = '0912'; // เปลี่ยนเป็นวันครอบรอบจริง เช่น '0115' สำหรับ 15 มกราคม

        function addPin(num) {
            if (pinCode.length < 4) {
                pinCode += num;
                updatePinDisplay();
                
                if (pinCode.length === 4) {
                    setTimeout(checkPin, 500);
                }
            }
        }

        function clearPin() {
            pinCode = '';
            updatePinDisplay();
        }

        function updatePinDisplay() {
            for (let i = 1; i <= 4; i++) {
                const dot = document.getElementById('pin' + i);
                if (i <= pinCode.length) {
                    dot.textContent = pinCode[i-1];
                    dot.classList.add('filled');
                } else {
                    dot.textContent = '';
                    dot.classList.remove('filled');
                }
            }
        }

        function checkPin() {
            if (pinCode === correctPin) {
                createHearts(25);
                createConfetti();
                setTimeout(() => {
                    window.location.href = 'moments.html';
                }, 1200);
            } else {
                const pinDisplay = document.querySelector('.pin-display');
                pinDisplay.style.animation = 'none';
                setTimeout(() => {
                    pinDisplay.style.animation = 'wrongShake 0.5s ease-in-out';
                }, 10);
                
                setTimeout(() => {
                    alert('รหัสไม่ถูกต้อง ลองใหม่อีกครั้งนะ 💕');
                    clearPin();
                }, 500);
            }
        }

        function createHearts(count = 15) {
            const hearts = ['💕', '💖', '💗', '💘', '💝', '💓'];
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart-float';
                    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                    heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 4000);
                }, i * 80);
            }
        }

        function createConfetti() {
            const colors = ['#ff6b9d', '#ff1744', '#ffc9d9', '#ffb3c6'];
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'particle';
                    confetti.style.position = 'fixed';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = '-10px';
                    confetti.style.width = '10px';
                    confetti.style.height = '10px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                    confetti.style.zIndex = '9999';
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 4000);
                }, i * 30);
            }
        }
    </script>
</body>
</html>
